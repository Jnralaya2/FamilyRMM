name: Deployment script safety tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-script-tests:
    name: Mocked deployment and rollback scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deployment script integration tests
        env:
          REQUIRE_POSIX_DEPLOYMENT_TESTS: "1"
        run: node --test tests/deployment-scripts.test.mjs
