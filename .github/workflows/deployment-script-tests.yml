name: Ubuntu checks and tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-script-tests:
    name: Type check, build, and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build production dashboard
        run: npm run build

      - name: Run full test suite (including POSIX deployment tests)
        env:
          REQUIRE_POSIX_DEPLOYMENT_TESTS: "1"
        run: npm test
