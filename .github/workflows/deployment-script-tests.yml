name: Ubuntu checks and tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-script-tests:
    name: Type check, build, and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet-cli
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Windows installer validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y msitools wixl
          command -v wixl
          command -v pwsh

      - name: Install locked dependencies
        run: npm ci

      - name: Restore Windows agent dependencies
        run: dotnet restore agent/FamilyRmm.Agent/FamilyRmm.Agent.csproj -p:EnableWindowsTargeting=true -p:EnableAgentTestHarness=true

      - name: Restore Windows bootstrapper dependencies
        run: dotnet restore agent/FamilyRmm.Bootstrapper/FamilyRmm.Bootstrapper.csproj -p:EnableWindowsTargeting=true

      - name: Restore cross-platform agent policy test dependencies
        run: dotnet restore agent/FamilyRmm.Agent/FamilyRmm.Agent.csproj -p:TargetFramework=net10.0 -p:RuntimeIdentifier=linux-x64 -p:SelfContained=false -p:UseAppHost=false -p:PublishSingleFile=false -p:EnableWindowsTargeting=true -p:EnableAgentTestHarness=true -p:BaseIntermediateOutputPath=${{ github.workspace }}/agent/FamilyRmm.Agent/obj/ -p:MSBuildProjectExtensionsPath=${{ github.workspace }}/agent/FamilyRmm.Agent/obj/linux-policy-self-test/

      - name: Type check
        run: npm run check

      - name: Build production dashboard
        run: npm run build

      - name: Run full test suite (including POSIX deployment tests)
        env:
          REQUIRE_POSIX_DEPLOYMENT_TESTS: "1"
        run: npm test
